[project]
name = "quran-harness"
version = "0.10.0"
description = "Harnais d'étude des corrélations coraniques"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=3.0.6",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ia = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quran_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
