<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coran++ — قواعد انتظام الجذر في القرآن</title>
<style>
  :root {
    --bg: #f7f5f0; --panel: #ffffff; --ink: #1f2328; --muted: #5b6470; --line: #d9d4c8;
    --accent: #1f5f4a; --accent-ink: #ffffff; --head: #efebe1; --mark: #fff1c2; --warn: #8a4b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --panel: #1e2125; --ink: #e6e3dc; --muted: #9aa3ad; --line: #353a41;
      --accent: #6fc3a5; --accent-ink: #10231c; --head: #262a2f; --mark: #4a3d12; --warn: #e0a458;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.7 "Amiri", "Scheherazade New", "Traditional Arabic", "Segoe UI", "Tahoma", sans-serif; }
  header, main { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 18px; }
  h1 { font-size: 24px; margin: 0; }
  header p { margin: 0; color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin: 16px 0 0; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line); border-bottom: none; background: var(--head); color: var(--ink);
    padding: 8px 16px; border-radius: 8px 8px 0 0; cursor: pointer; font: inherit; }
  .tabs button[aria-selected="true"] { background: var(--panel); font-weight: 700; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px 0 8px 8px; padding: 14px;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: end; }
  form[hidden], [hidden] { display: none !important; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--muted); }
  input[type=text], select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); min-width: 140px; }
  input.word { font-size: 22px; width: 200px; }
  input.ref { direction: ltr; text-align: left; width: 150px; }
  label.check { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); padding-bottom: 8px; }
  button.go { font: inherit; font-weight: 700; padding: 8px 20px; border: none; border-radius: 6px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: progress; }
  .tools { margin-inline-start: auto; }
  .tools button { font: inherit; font-size: 15px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); cursor: pointer; }
  .message { margin: 16px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .message.error { border-color: var(--warn); color: var(--warn); }
  .forms { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .forms button { font: inherit; font-size: 19px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 18px;
    background: var(--panel); color: var(--ink); cursor: pointer; }
  .forms button small { color: var(--muted); font-size: 13px; margin-inline-start: 6px; }
  .forms button:hover { border-color: var(--accent); }
  article { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 18px 18px; margin-top: 18px; }
  article h2 { font-size: 24px; margin: 14px 0 4px; }
  article h3 { font-size: 20px; margin: 26px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  article h4 { font-size: 17px; margin: 18px 0 6px; color: var(--muted); }
  article p, article li { margin: 4px 0; }
  article ul { padding-inline-start: 22px; }
  article code { font-size: 19px; background: var(--head); padding: 1px 6px; border-radius: 4px; }
  article strong { background: var(--mark); padding: 0 3px; border-radius: 3px; }
  .scroll { overflow-x: auto; margin: 8px 0; }
  table { border-collapse: collapse; font-size: 17px; }
  th, td { text-align: right; padding: 5px 9px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { background: var(--head); font-weight: 700; position: sticky; top: 0; }
  td:last-child { white-space: normal; }
  footer { color: var(--muted); font-size: 14px; margin: 26px 0 40px; }
  @media print {
    .tabs, form, footer { display: none; }
    article { border: none; padding: 0; }
    body { background: #fff; color: #000; }
  }
</style>
</head>
<body>
<header>
  <h1><span dir="ltr">Coran++</span></h1>
  <p>قواعد انتظام الجذر في القرآن — وصف دون تأويل</p>
</header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="racine" aria-selected="true">الجذر</button>
    <button role="tab" data-tab="fiche" aria-selected="false">الصيغة</button>
    <button role="tab" data-tab="comparer" aria-selected="false">مقارنة صيغتين</button>
    <button role="tab" data-tab="paire" aria-selected="false">المقارنة الثنائية</button>
  </div>

  <form id="form-racine" data-tab="racine">
    <label>الجذر <input class="word" type="text" name="q" value="قدر" required></label>
    <button class="go" type="submit">عرض هوية الجذر</button>
    <span class="tools"><button type="button" class="print">طباعة / PDF</button></span>
  </form>

  <form id="form-fiche" data-tab="fiche" hidden>
    <label>الصيغة <input class="word" type="text" name="q" value="يقدر" required></label>
    <label>التقطيع <select name="pause"></select></label>
    <label class="check"><input type="checkbox" name="detail"> كل التفاصيل</label>
    <label class="check"><input type="checkbox" name="stats"> اختبار بالخلط العشوائي (نصف دقيقة)</label>
    <button class="go" type="submit">عرض البطاقة</button>
    <span class="tools"><button type="button" class="print">طباعة / PDF</button></span>
  </form>

  <form id="form-comparer" data-tab="comparer" hidden>
    <label>الصيغة الأولى <input class="word" type="text" name="a" value="يقدر" required></label>
    <label>الصيغة الثانية <input class="word" type="text" name="b" value="قدير" required></label>
    <label>التقطيع <select name="pause"></select></label>
    <label class="check"><input type="checkbox" name="detail"> كل التفاصيل</label>
    <label class="check"><input type="checkbox" name="stats"> اختبار بالخلط العشوائي</label>
    <button class="go" type="submit">قارن الصيغتين</button>
    <span class="tools"><button type="button" class="print">طباعة / PDF</button></span>
  </form>

  <form id="form-paire" data-tab="paire" hidden>
    <label>المقطع أ <input class="ref" type="text" name="a" value="34:36:1-8" required></label>
    <label>المقطع ب <input class="ref" type="text" name="b" value="17:30:1-7" required></label>
    <label>الصيغة المرجعية <input class="word" type="text" name="pivot" value="يقدر" required></label>
    <button class="go" type="submit">قارن</button>
    <span class="tools"><button type="button" class="print">طباعة / PDF</button></span>
  </form>

  <div id="notice"></div>
  <div id="forms" class="forms"></div>
  <article id="result" hidden></article>
  <footer id="footer"></footer>
</main>
<script>
const $ = (selector, root = document) => root.querySelector(selector);
const forms = { racine: $("#form-racine"), fiche: $("#form-fiche"), comparer: $("#form-comparer"), paire: $("#form-paire") };

function show(tab) {
  for (const button of document.querySelectorAll(".tabs button")) {
    button.setAttribute("aria-selected", String(button.dataset.tab === tab));
  }
  for (const [name, form] of Object.entries(forms)) form.hidden = name !== tab;
}

function notice(text, error = false) {
  $("#notice").innerHTML = text ? `<div class="message${error ? " error" : ""}"></div>` : "";
  if (text) $("#notice .message").textContent = text;
}

async function ask(path, params, button) {
  notice("");
  button.disabled = true;
  try {
    const response = await fetch(path + "?" + new URLSearchParams(params));
    const body = await response.json();
    if (!response.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail));
    return body;
  } catch (error) {
    notice(error.message, true);
    return null;
  } finally {
    button.disabled = false;
  }
}

function display(html) {
  const result = $("#result");
  result.innerHTML = html;
  result.hidden = false;
}

function formButtons(items, title) {
  const box = $("#forms");
  box.innerHTML = "";
  if (!items.length) return;
  const label = document.createElement("span");
  label.textContent = title;
  box.append(label);
  for (const item of items) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = item.form;
    const count = document.createElement("small");
    count.textContent = item.occurrences;
    button.append(count);
    button.addEventListener("click", () => openSheet(item.form));
    box.append(button);
  }
}

async function openSheet(form) {
  show("fiche");
  forms.fiche.q.value = form;
  forms.fiche.requestSubmit();
}

forms.racine.addEventListener("submit", async (event) => {
  event.preventDefault();
  const body = await ask("/api/racine", { q: forms.racine.q.value }, $("button.go", forms.racine));
  if (!body) return;
  display(body.html);
  formButtons(body.forms, "صيغ الجذر في القرآن (اضغط لفتح البطاقة) :");
});

forms.fiche.addEventListener("submit", async (event) => {
  event.preventDefault();
  const f = forms.fiche;
  const body = await ask("/api/fiche", { q: f.q.value, pause: f.pause.value, detail: f.detail.checked, stats: f.stats.checked },
                         $("button.go", f));
  if (!body) return;
  display(body.html);
  const others = body.candidates.filter((c) => c.form !== body.form);
  formButtons(others, others.length ? "الكتابة تشمل صيغا أخرى أيضا :" : "");
});

forms.comparer.addEventListener("submit", async (event) => {
  event.preventDefault();
  const f = forms.comparer;
  const body = await ask("/api/comparer", { a: f.a.value, b: f.b.value, pause: f.pause.value, detail: f.detail.checked, stats: f.stats.checked },
                         $("button.go", f));
  if (!body) return;
  $("#forms").innerHTML = "";
  notice(body.notes.join(" ؛ "));
  display(body.html);
});

forms.paire.addEventListener("submit", async (event) => {
  event.preventDefault();
  const f = forms.paire;
  const body = await ask("/api/paire", { a: f.a.value, b: f.b.value, pivot: f.pivot.value }, $("button.go", f));
  if (!body) return;
  $("#forms").innerHTML = "";
  display(body.html);
});

for (const button of document.querySelectorAll(".tabs button")) {
  button.addEventListener("click", () => show(button.dataset.tab));
}
for (const button of document.querySelectorAll("button.print")) {
  button.addEventListener("click", () => window.print());
}

fetch("/api/meta").then((r) => r.json()).then((meta) => {
  for (const select of [forms.fiche.pause, forms.comparer.pause]) {
    for (const pause of meta.pauses) {
      select.add(new Option(pause.label, pause.id, false, pause.id === meta.default_pause));
    }
  }
  $("#footer").textContent = `⁦Coran++⁩ · نسخة البرنامج ${meta.version} · الرواية : حفص · البرنامج يصف ولا يؤول`;
});
</script>
</body>
</html>
