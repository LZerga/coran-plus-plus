# config.yaml — Choix de méthode du harnais.
# Valeurs par défaut du SPEC. Les points ouverts renvoient à QUESTIONS.md (Qn).

reading: hafs

segmentation:
  scheme: waqf          # waqf | aya            (Q1)
  pause_level: strict   # strict | souple       (Q1)
  # Marques de pause qui ferment un segment, pour chaque niveau. La fin de verset
  # ferme toujours un segment. Noms : lazim (م), qala (قلى), jaiz (ج), sala (صلى).
  pause_levels:
    strict: [lazim, qala]              # pause obligatoire ou préférable
    souple: [lazim, qala, jaiz, sala]  # toutes les pauses permises
  # Paire de trois points (∴ ∴) : on s'arrête à l'une des deux, pas aux deux.
  muanaqa: none         # none | first | second   (Q16)

form:                   # la forme d'une case (DECISIONS.md D-02, D-03, D-04)
  # واو collées en tête de mot que l'on met à part, selon l'étiquette du corpus :
  # عاطفة CONJ, استئنافية REM, حالية CIRC, زائدة SUP, قسم P, معية COM.
  # Décision de l'utilisateur (2026-10-12) : les six.   (Q20)
  detached_waw_tags: [CONJ, REM, CIRC, SUP, P, COM]
  # Signes qui tiennent au mot voisin : shadda d'assimilation de la première lettre
  # (لَّا / لَا), alif suscrit final absent devant un alif de liaison (عَلَى / عَلَىٰ).   (Q21)
  assimilation_marks_in_form: false
  final_vowel_in_form: false          # voyelle finale, الإعراب   (D-04, Q27)

pairs:                  # niveau 1 : comparaison directe de deux segments (SPEC §2.3)
  min_block: 2          # cases E0 consécutives pour un bloc (تطابق جزئي)
  r2_min_common: 2      # éléments communs (E0 à E3) hors blocs pour تشابه
  # La forme de référence compte parmi les éléments communs.
  # Décision de l'utilisateur (2026-10-16), comme le document.   (Q23)
  pivot_counts: true

families:               # niveau 2 : familles tracées par la typologie (SPEC §2.4)
  # Une paire R1 ou R2 relie deux segments s'ils ont au moins ce nombre d'éléments
  # communs en plus de la forme de référence. Décision de l'utilisateur (2026-10-16).   (Q23, D-08)
  link_min_common: 1
  cohesion_min: 0.5     # part minimale des paires internes en R1 ou R2   (D-15)

matrix:                 # niveau 3 : matrices d'alignement (SPEC §2.5)
  relative_min: 0.75    # colonne « relativement fixe » : même forme dans cette part des lignes   (D-09)

statistics:             # (Q10) ; contrôle aléatoire, refait sur les cases au lot E
  seed: 20261010
  permutations: 1000
  # Contrôles aléatoires : on mélange les mots entre segments en gardant la taille des
  # segments. corpus = dans tout le texte (SPEC) ; sura = à l'intérieur de chaque sourate.
  controls: [corpus, sura]
  alpha: 0.05           # seuil, appliqué après correction pour tests multiples
  min_cooccurrence: 2   # en dessous, l'association est dite trop rare pour conclure
